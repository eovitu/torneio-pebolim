      content="Acompanhe campeonatos de pebolim com partidas ao vivo, classificação, artilharia e histórico de jogadores. Entre para disputar ou consulte o conteúdo público sem criar conta."

    <meta property="og:site_name" content="Torneio Pebolim" />

      property="og:image"
      content="https://torneio-pebolim.vercel.app/compartilhamento-pebolim-v2.jpg"

      content="Mesa de pebolim em perspectiva, com campo verde e bonecos laranja e claros."

      name="twitter:description"
      content="Acompanhe campeonatos de pebolim com partidas ao vivo, classificação, artilharia e histórico de jogadores. Entre para disputar ou consulte o conteúdo público sem criar conta."
    />
    <meta
      name="twitter:image"
      content="https://torneio-pebolim.vercel.app/compartilhamento-pebolim-v2.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Mesa de pebolim em perspectiva, com campo verde e bonecos laranja e claros."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Torneio Pebolim",
        "url": "https://torneio-pebolim.vercel.app/"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap"
    />
    <title>Torneio de Pebolim</title>
  </head>
  <body>
    <div id="root">
      <!-- INITIAL_HOME_START -->
      <main
        style="
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: linear-gradient(150deg, #07231a 0%, #0f4c35 55%, #146345 100%);
          color: #fff;
          font-family:
            Archivo,
            system-ui,
            -apple-system,
            sans-serif;
        "
      >
        <div
          style="width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 20px"
        >
          <p
            style="
              margin: 0;
              color: #ff9c66;
              font-size: 10px;
              font-weight: 800;
              letter-spacing: 0.24em;
              text-transform: uppercase;
            "
          >
            ● Torneio Pebolim
          </p>
          <h1
            style="
              margin: 0;
              font-size: clamp(40px, 10vw, 56px);
              line-height: 1;
              letter-spacing: -0.04em;
              font-weight: 800;
            "
          >
            O campeonato<br />na palma da mão.
          </h1>
          <p
            style="margin: 0; color: rgba(255, 255, 255, 0.85); font-size: 17px; line-height: 1.55"
          >
            Placar ao vivo, classificação, artilharia e o histórico de cada jogador. Entre para
            disputar — ou só acompanhe, sem conta nenhuma.
          </p>
          <nav
            aria-label="Acesso ao torneio"
            style="display: flex; flex-direction: column; gap: 12px"
          >
            <a
              href="/login"
              style="
                display: block;
                padding: 14px 18px;
                border-radius: 8px;
                background: #f2620f;
                color: #fff;
                text-align: center;
                font-weight: 700;
                text-decoration: none;
              "
              >Entrar</a
            >
            <a
              href="/register"
              style="
                display: block;
                padding: 14px 18px;
                border: 1px solid rgba(255, 255, 255, 0.7);
                border-radius: 8px;
                color: #fff;
                text-align: center;
                font-weight: 700;
                text-decoration: none;
              "
              >Criar conta</a
            >
            <a
              href="/home"
              style="
                align-self: center;
                padding: 10px;
                color: rgba(255, 255, 255, 0.85);
                text-underline-offset: 3px;
              "
              >Acompanhar sem entrar</a
            >
          </nav>
        </div>
      </main>
      <!-- INITIAL_HOME_END -->
    </div>
    <noscript
      >Esta aplicação e suas atualizações precisam de JavaScript. Ative o JavaScript para usar o
      Torneio Pebolim.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
